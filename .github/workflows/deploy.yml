name: Build and Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  SSM_PREFIX: /salon-platform-prod/app/antrahq

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Persist Next.js's own build cache so unchanged modules are not recompiled.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build static export
        env:
          NEXT_PUBLIC_API_URL: https://api.antrahq.com
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_MANAGER_APP_URL: https://app.antrahq.com
          NEXT_PUBLIC_EMPLOYEE_APP_URL: https://employee.antrahq.com
          NEXT_PUBLIC_PLATFORM_APP_URL: https://platform.antrahq.com
          ANDROID_SHA256_EMPLOYEE: ${{ secrets.ANDROID_SHA256_EMPLOYEE }}
          ANDROID_SHA256_MANAGER: ${{ secrets.ANDROID_SHA256_MANAGER }}
          ANDROID_SHA256_PLATFORM: ${{ secrets.ANDROID_SHA256_PLATFORM }}
        run: |
          npm ci
          npm run generate-icons
          node scripts/generate-assetlinks.mjs
          npm run build -- --webpack
          if ! grep -rq "api.antrahq.com" out/_next/static/chunks/; then
            echo "::error::Production build is missing api.antrahq.com in client bundles."
            exit 1
          fi
          if grep -rq 'let e="http://localhost:8080"' out/_next/static/chunks/; then
            echo "::error::Production build baked in localhost API URL. Ensure CI env overrides .env.local."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deploy targets from SSM
        id: ssm
        run: |
          echo "bucket=$(aws ssm get-parameter --name ${SSM_PREFIX}/s3_bucket --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(aws ssm get-parameter --name ${SSM_PREFIX}/cloudfront_distribution_id --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"

      # Hashed assets first (a file name never changes content, so size is enough to skip an
      # upload), then the pages that reference them, so a page never points at a missing chunk.
      - name: Sync hashed assets to S3
        run: |
          aws s3 sync out/_next/static "s3://${{ steps.ssm.outputs.bucket }}/__app/_next/static" \
            --size-only --delete

      - name: Sync pages to S3
        run: |
          aws s3 sync out/ "s3://${{ steps.ssm.outputs.bucket }}/__app/" \
            --delete --exclude "_next/static/*"

      # The bundle content was already checked on disk before upload; only confirm the upload landed.
      - name: Verify app entrypoint exists
        run: |
          aws s3api head-object --bucket "${{ steps.ssm.outputs.bucket }}" --key "__app/login/index.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.ssm.outputs.distribution_id }}" \
            --paths "/*"
