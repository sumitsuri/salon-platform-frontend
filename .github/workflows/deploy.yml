name: Build and Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  SSM_PREFIX: /salon-platform-prod/app/antrahq

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build static export
        env:
          NEXT_PUBLIC_API_URL: https://api.antrahq.com
          NEXT_PUBLIC_BASE_PATH: ""
        run: |
          npm ci
          npm run build -- --webpack
          if ! grep -rq "api.antrahq.com" out/_next/static/chunks/; then
            echo "::error::Production build is missing api.antrahq.com in client bundles."
            exit 1
          fi
          if grep -rq 'let e="http://localhost:8080"' out/_next/static/chunks/; then
            echo "::error::Production build baked in localhost API URL. Ensure CI env overrides .env.local."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deploy targets from SSM
        id: ssm
        run: |
          echo "bucket=$(aws ssm get-parameter --name ${SSM_PREFIX}/s3_bucket --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(aws ssm get-parameter --name ${SSM_PREFIX}/cloudfront_distribution_id --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: aws s3 sync out/ "s3://${{ steps.ssm.outputs.bucket }}/__app/" --delete

      - name: Verify app entrypoint exists
        run: |
          BUCKET="${{ steps.ssm.outputs.bucket }}"
          aws s3api head-object --bucket "$BUCKET" --key "__app/login/index.html"
          mkdir -p /tmp/app-chunks
          aws s3 sync "s3://${BUCKET}/__app/_next/static/chunks/" /tmp/app-chunks/
          if grep -rq 'let e="http://localhost:8080"' /tmp/app-chunks/; then
            echo "::error::Deployed app bundle still references localhost:8080"
            exit 1
          fi
          if ! grep -rq "api.antrahq.com" /tmp/app-chunks/; then
            echo "::error::Deployed app bundle missing api.antrahq.com"
            exit 1
          fi

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.ssm.outputs.distribution_id }}" \
            --paths "/*"
