name: Deploy Antrahq marketing (from pravaah-marketing)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-marketing.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  SSM_PREFIX: /salon-platform-prod/marketing/antrahq

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sumitsuri/pravaah-marketing
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build static export
        env:
          NEXT_PUBLIC_API_URL: https://api.antrahq.com
        run: |
          npm ci
          npm run build
          # CloudFront custom error page expects /404.html at bucket root
          if [ -f out/404/index.html ] && [ ! -f out/404.html ]; then
            cp out/404/index.html out/404.html
          fi
          test -f out/404.html || test -f out/404/index.html

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deploy targets from SSM
        id: ssm
        run: |
          echo "bucket=$(aws ssm get-parameter --name ${SSM_PREFIX}/s3_bucket --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(aws ssm get-parameter --name ${SSM_PREFIX}/cloudfront_distribution_id --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: |
          # __app* (not __app/*) — single-level exclude leaves nested keys like __app/login/index.html deletable.
          aws s3 sync out/ "s3://${{ steps.ssm.outputs.bucket }}/" --delete \
            --exclude "__app*"

      - name: Verify ops app prefix was not touched
        run: |
          aws s3api head-object \
            --bucket "${{ steps.ssm.outputs.bucket }}" \
            --key "__app/login/index.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.ssm.outputs.distribution_id }}" \
            --paths "/*"
